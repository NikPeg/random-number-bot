name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALICE_STICKER_PACK: ${{ secrets.ALICE_STICKER_PACK }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DELETE_CHANNEL_MESSAGES: ${{ secrets.DELETE_CHANNEL_MESSAGES }}
          REPLY_USER_IDS: ${{ secrets.REPLY_USER_IDS }}
          REPLY_USERNAMES: ${{ secrets.REPLY_USERNAMES }}
          REPLY_TEXT: ${{ secrets.REPLY_TEXT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BOT_TOKEN,ALICE_STICKER_PACK,ADMIN_ID,DELETE_CHANNEL_MESSAGES,REPLY_USER_IDS,REPLY_USERNAMES,REPLY_TEXT
          script: |
            set -e

            DEPLOY_DIR="$HOME/random-number-bot"
            CONTAINER_FILTER="random-number-bot"

            echo "=== Останавливаем старые контейнеры ==="
            CONTAINER_IDS=$(docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}" || true)
            if [ -n "$CONTAINER_IDS" ]; then
              for CID in $CONTAINER_IDS; do
                echo "  Снимаем restart policy с $CID..."
                docker update --restart=no "$CID" 2>/dev/null || true

                CID_PID=$(docker inspect "$CID" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CID_PID" ] && [ "$CID_PID" != "0" ]; then
                  echo "  Убиваем PID $CID_PID..."
                  sudo kill -9 "$CID_PID" 2>/dev/null || true
                  sleep 1
                fi

                docker rm -f "$CID" 2>/dev/null || true
              done
              sleep 2
            fi

            if docker ps -a --filter name=$CONTAINER_FILTER --format "{{.Names}}" | grep -q .; then
              echo "Контейнер всё ещё существует, экстренное удаление..."
              docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}" | xargs -r docker rm -f
              sleep 2
            fi
            echo "✅ Старые контейнеры удалены"

            echo "=== Обновляем код ==="
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone https://github.com/NikPeg/random-number-bot.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git pull origin main

            echo "=== Пишем .env ==="
            {
              printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
              printf 'ALICE_STICKER_PACK=%s\n' "$ALICE_STICKER_PACK"
              printf 'ADMIN_ID=%s\n' "$ADMIN_ID"
              printf 'DELETE_CHANNEL_MESSAGES=%s\n' "$DELETE_CHANNEL_MESSAGES"
              printf 'REPLY_USER_IDS=%s\n' "$REPLY_USER_IDS"
              printf 'REPLY_USERNAMES=%s\n' "$REPLY_USERNAMES"
              printf 'REPLY_TEXT=%s\n' "$REPLY_TEXT"
            } > .env

            echo "=== Запускаем контейнер ==="
            docker compose up --build -d

            echo "=== Проверяем запуск ==="
            sleep 5
            if docker ps --filter name=$CONTAINER_FILTER --filter status=running | grep -q .; then
              echo "✅ Бот запущен"
              docker ps --filter name=$CONTAINER_FILTER
              docker logs $(docker ps --filter name=$CONTAINER_FILTER --format "{{.ID}}") --tail=20
            else
              echo "❌ Контейнер не запустился!"
              docker logs $(docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}") --tail=50 2>&1 || true
              exit 1
            fi
